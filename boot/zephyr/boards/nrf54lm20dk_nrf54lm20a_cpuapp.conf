# Logging enabled for debug; UART console coexists with CDC ACM because
# zephyr,uart-mcumgr is redirected to uart30 in the overlay.
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Serial
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# MCUboot serial recovery over USB CDC ACM (uses USB_DEVICE_STACK_NEXT)
CONFIG_GPIO=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y

# Enter serial recovery when button 0 is held during reset
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y

# Also enter serial recovery if no valid application exists
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# Overwrite-only upgrades: apps do not need to confirm themselves
CONFIG_BOOT_UPGRADE_ONLY=y

# Required by USB
CONFIG_MULTITHREADING=y

# Use ED25519 signatures (smaller than RSA, fits in 62 KB boot partition)
CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y

# Override auto-calculated sector count (934 KB / 4 KB = 234 sectors)
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=234

# Board-specific
CONFIG_SPI_NOR=n
CONFIG_BOOT_WATCHDOG_FEED=n
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=32

# Enable indicator LED to see that bootloader is active
CONFIG_MCUBOOT_INDICATION_LED=y

# Enable internal 32kHz clock source instead of external crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
